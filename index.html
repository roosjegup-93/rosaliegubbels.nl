<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosalie Gubbels Creative Design</title>
<meta name="description" content="Rosalie Gubbels, creative designer uit Amsterdam. Branding, campagnes, editorial, events en webdesign.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: wide editorial grid, square 3-up work tiles, quiet chrome so the work carries the colour */
:root{
  --bg:#ffffff;
  --bg-soft:#f3f3f1;
  --ink:#151515;
  --muted:#6d6d69;
  --line:#e4e4e0;
  --accent:#2f43e8;
  --header:#ffffff;
  --header-hover:#ffffff;
  --header-ink:#151515;
  --font-display:"Karla", "Helvetica Neue", Arial, sans-serif;
  --font-body:"Karla", "Helvetica Neue", Arial, sans-serif;
  --max:1360px;
  --gutter:clamp(16px, 4vw, 48px);
  --gap:clamp(32px, 4vw, 56px);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(var(--gutter), env(safe-area-inset-left,0px));padding-right:max(var(--gutter), env(safe-area-inset-right,0px))}

/* Header */
/* Header keeps its pastel colours in both themes, so its text is always dark */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--line);background:var(--header);color:var(--header-ink);transition:background-color 1.8s ease}
header.site:hover{background:var(--header-hover)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--header);transition:background-color 1.8s ease}
/* The coloured top: header plus the opening block of each page, one surface that changes colour together */
.band{background:var(--header);transition:background-color 1.8s ease;
  --ink:#151515;--muted:rgba(21,21,21,.68);--line:rgba(21,21,21,.18);--bg-soft:rgba(255,255,255,.55);--accent:#2f43e8;--bg:#ffffff;color:var(--ink)}
body:has(header.site:hover, .view:not([hidden]) .band:hover) :is(header.site, .view:not([hidden]) .band){background:var(--header-hover)}
body:has(header.site:hover, .view:not([hidden]) .band:hover)::before{background:var(--header-hover)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;padding-block:24px;flex-wrap:wrap}
.logo{font:700 20px/1 var(--font-display);letter-spacing:-.01em;text-decoration:none}
.logo span{color:rgba(21,21,21,.6);font-weight:400}
@media (max-width:520px){.logo span{display:none}}
.right{display:flex;align-items:center;gap:clamp(14px,2.4vw,32px);flex-wrap:wrap}
nav.main{display:flex;gap:clamp(14px,2.4vw,32px);flex-wrap:wrap}
nav.main a{font-size:clamp(17px,1.5vw,19px);font-weight:500;text-decoration:none;color:rgba(21,21,21,.68);transition:color .15s}
nav.main a:hover,nav.main a[aria-current="page"]{color:var(--header-ink)}
nav.main a[aria-current="page"]{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1.5px}
.lang{display:flex;border:1px solid rgba(21,21,21,.25);border-radius:999px;padding:2px}
.lang button{font:600 13px/1 var(--font-body);letter-spacing:.06em;border:0;background:none;color:rgba(21,21,21,.68);padding:7px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--header-ink);color:#fff}

/* Views */
.view[hidden]{display:none!important}
main{min-height:70vh}

/* Hero */
.hero{padding-block:clamp(56px,10vw,140px) clamp(64px,9vw,128px)}
.hero h1{font:600 clamp(36px,6.4vw,88px)/1.02 var(--font-display);letter-spacing:-.03em;margin:0;max-width:17ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-sub{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px;margin-top:clamp(28px,4vw,48px)}
.hero p{margin:0;max-width:56ch;color:var(--muted);font-size:clamp(16px,1.5vw,19px)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:20px 34px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;font-size:clamp(17px,1.5vw,19px);border:0;cursor:pointer;transition:transform .15s, background .15s}
.btn:hover{transform:translateY(-1px);background:var(--accent);color:#fff}
.btn svg{width:18px;height:18px}

/* Filters */
.work-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:20px 40px;padding-block:var(--gap);border-top:1px solid var(--line)}
.work-head h2{font:600 15px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;margin:0}
.work-head h2 small{color:var(--muted);font-weight:500;margin-left:6px;letter-spacing:0}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 14px/1 var(--font-body);padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Grid */
/* Justified rows: tiles in a row share one image height, widths follow each image's proportions */
.grid{display:flex;flex-direction:column;gap:var(--gap);padding-bottom:clamp(88px,10vw,160px)}
.row{display:flex;gap:var(--gap);align-items:flex-start}
.tile{text-decoration:none;display:flex;flex-direction:column;gap:16px;min-width:0}
.tile[hidden]{display:none}
.frames{position:relative;max-width:100%;overflow:hidden;background:#fff}
/* Hairline drawn on top of the image, so every tile gets the same crisp edge without changing its size */
.frames::after{content:"";position:absolute;inset:0;border:1px solid rgba(21,21,21,.12);pointer-events:none;z-index:1}
/* Soft crossfade with a slow drift, so the frames blend instead of flicking */
.frames img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease-in-out}
.frames img.on{opacity:1}
.frames .count{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
.frames .count i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 1px rgba(0,0,0,.08);transition:background .6s}
.frames .count i.on{background:#fff}
.tile-meta{display:flex;flex-direction:column;gap:10px}
.tile-h{font:600 19px/1.25 var(--font-display);letter-spacing:-.01em;margin:0;transition:color .15s}
.tile:hover .tile-h{color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 12px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--bg-soft);color:var(--muted)}

/* Project page */
.p-head{padding-block:clamp(48px,7vw,100px) clamp(56px,7vw,100px)}
.back{display:inline-flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);text-decoration:none;margin-bottom:clamp(24px,4vw,40px)}
.back:hover{color:var(--ink)}
.p-head h1{font:600 clamp(34px,5.6vw,76px)/1.03 var(--font-display);letter-spacing:-.03em;margin:0 0 clamp(28px,4vw,48px);text-wrap:balance;max-width:20ch}
.p-intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(32px,6vw,104px);border-top:1px solid var(--line);padding-top:36px}
@media (max-width:760px){.p-intro{grid-template-columns:1fr}}
.facts{display:grid;gap:24px;margin:0;align-content:start}
.facts dt{font:600 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.facts dd{margin:0;font-size:16px}
.p-text{min-width:0}
.p-text p{margin:0 0 1em;max-width:62ch;font-size:clamp(17px,1.45vw,20px);line-height:1.6}
.p-text a.ext{display:inline-flex;gap:8px;align-items:center;font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--accent);padding-bottom:2px}
.gallery{display:flex;flex-direction:column;gap:var(--gap);padding-block:0 clamp(56px,7vw,104px)}
.grow{display:flex;gap:var(--gap);align-items:flex-start}
.gallery figure{margin:0;min-width:0;cursor:zoom-in}
/* the hairline sits on the image itself, so there are never empty boxes around it */
.gallery img{width:100%;height:auto;outline:1px solid rgba(21,21,21,.12);outline-offset:-1px}
.gallery .caption{font:600 clamp(18px,1.6vw,22px)/1.25 var(--font-display);letter-spacing:-.01em;margin:var(--gap) 0 calc(var(--gap) * -.5)}
.gallery .caption:first-child{margin-top:0}
.p-next{border-top:1px solid var(--line);padding-block:clamp(32px,5vw,64px) clamp(56px,7vw,100px);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.p-next a{text-decoration:none;display:flex;flex-direction:column;gap:6px;max-width:48%}
.p-next a:last-child{text-align:right;margin-left:auto}
.p-next small{font:600 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.p-next b{font:600 clamp(20px,2.4vw,32px)/1.15 var(--font-display);letter-spacing:-.02em}
.p-next a:hover b{color:var(--accent)}
@media (max-width:560px){.p-next a{max-width:100%}.p-next a:last-child{text-align:left;margin-left:0}}

/* Simple pages */
.page{padding-block:clamp(56px,8vw,120px)}
.page-body{padding-block:0 clamp(88px,10vw,160px)}
.page h1{font:600 clamp(36px,6vw,80px)/1.03 var(--font-display);letter-spacing:-.03em;margin:0 0 clamp(28px,4vw,52px);max-width:18ch;text-wrap:balance}
.lead{font-size:clamp(18px,1.8vw,23px);line-height:1.6;max-width:58ch;margin:0 0 1.1em}
.lead:last-child{margin-bottom:0}
.about{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(40px,6vw,96px);align-items:center}
.about-photo{margin:0;width:clamp(240px,30vw,420px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--bg-soft)}
.about-photo img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1)}
@media (max-width:860px){.about{grid-template-columns:1fr}.about-photo{order:-1;width:min(260px,70vw);margin-inline:auto}}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(32px,6vw,96px);align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.two > *{min-width:0}
.cv{margin:0;max-width:820px;border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:zoom-in}
.sub-link{margin:var(--gap) 0 0;font-weight:600}
.sub-link a{text-decoration:none;border-bottom:1.5px solid var(--accent);padding-bottom:2px}
/* About has a small dropdown with Photography */
.has-sub{position:relative}
.sub{position:absolute;left:-14px;top:100%;padding:12px 14px 10px;background:var(--bg);border:1px solid var(--line);white-space:nowrap;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .2s,transform .2s,visibility .2s}
.has-sub:hover .sub,.has-sub:focus-within .sub{opacity:1;visibility:visible;transform:none}
.sub a{font-size:.9em}
@media (max-width:560px){.sub{display:none}}
.photos{columns:3 260px;column-gap:var(--gap)}
.photos figure{margin:0 0 var(--gap);break-inside:avoid;cursor:zoom-in;background:var(--bg-soft);border-radius:4px;overflow:hidden}
/* Contact fits on one screen: header and footer stay in view, content centred in between */
main:has(> #view-contact:not([hidden])){min-height:0}
#view-contact:not([hidden]){display:flex;flex-direction:column;justify-content:center;min-height:calc(100svh - var(--hdr, 90px) - var(--ftr, 100px))}
.contact-wrap{width:100%;padding-block:clamp(24px,4vh,48px)}
.contact-wrap h1{font:600 clamp(34px,5vw,64px)/1.05 var(--font-display);letter-spacing:-.03em;margin:0 0 clamp(14px,2.4vh,24px)}
.contact-wrap .lead{margin-bottom:clamp(28px,5vh,56px)}
.contact-list{display:grid;grid-template-columns:repeat(3,max-content);gap:24px clamp(32px,5vw,80px);margin:0;padding-top:clamp(20px,3.5vh,36px);border-top:1px solid var(--line)}
@media (max-width:760px){.contact-list{grid-template-columns:1fr;gap:18px}}
.contact-list dt{font:600 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.contact-list dd{margin:0;font:600 clamp(18px,1.8vw,24px)/1.25 var(--font-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.contact-list dd a{text-decoration:none;background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 2px no-repeat;transition:background-size .3s}
.contact-list dd a:hover{background-size:100% 2px}

/* Footer */
footer.site{border-top:1px solid var(--line)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;padding-block:40px;color:var(--muted);font-size:14px}
footer a{text-decoration:none}
.foot-nav{display:flex;gap:24px;flex-wrap:wrap}
.foot-nav a{color:var(--muted)}
.foot-nav a:hover{color:var(--ink)}
/* Services page */
.sec-h{font:600 15px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;margin:0 0 var(--gap);padding-top:var(--gap);border-top:1px solid var(--line)}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-bottom:calc(var(--gap) * 2)}
@media (max-width:960px){.services{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.services{grid-template-columns:1fr}}
.service{min-width:0}
.service h3,.steps h3{font:600 clamp(20px,1.9vw,24px)/1.25 var(--font-display);letter-spacing:-.01em;margin:0 0 10px}
.service p,.steps p{margin:0;color:var(--muted);max-width:42ch}
.service .ex{margin-top:14px;font-size:15px}
.service .ex span{color:var(--ink);font-weight:600}
.service .ex a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.service .ex a:hover{text-decoration-color:var(--accent);color:var(--accent)}
.steps{list-style:none;counter-reset:step;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin:0 0 calc(var(--gap) * 2)}
@media (max-width:960px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.steps li{counter-increment:step;min-width:0}
.steps li::before{content:counter(step, decimal-leading-zero);display:block;font:600 14px/1 var(--font-body);color:var(--accent);margin-bottom:14px;font-variant-numeric:tabular-nums}
.cta-band{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:24px 40px;border-top:1px solid var(--line);padding-top:var(--gap)}
.cta-band h2{font:600 clamp(26px,3.4vw,44px)/1.1 var(--font-display);letter-spacing:-.02em;margin:0 0 8px}
.cta-band p{margin:0;color:var(--muted)}
footer a:hover{color:var(--ink)}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.94);display:flex;align-items:center;justify-content:center;padding:56px max(48px, env(safe-area-inset-right,0px)) 56px max(48px, env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lb img{max-height:100%;max-width:100%;object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:#fff;cursor:pointer;padding:12px;font:500 15px var(--font-body);opacity:.8}
.lb button:hover{opacity:1}
.lb button[hidden]{display:none}
.lb .x{top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px))}
.lb .pv{left:calc(4px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%)}
.lb .nx{right:calc(4px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.lb .pv svg,.lb .nx svg{width:28px;height:28px}
.lb .ct{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#bbb;font-size:13px;font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* Phone: everything centred */
@media (max-width:560px){
  .bar,.right{justify-content:center;text-align:center}
  .bar{flex-direction:column;gap:14px}
  .hero,.page,.p-head,.page-body,.p-text,.facts,.contact-list,.contact-wrap{text-align:center}
  .contact-wrap .lead{margin-left:auto;margin-right:auto}
  .contact-wrap{padding-block:8px}
  .contact-wrap h1{font-size:30px}
  .contact-wrap .lead{font-size:16px;margin-bottom:22px}
  .contact-list{gap:14px;padding-top:18px}
  .contact-list dd{font-size:18px}
  footer .wrap{padding-block:20px;gap:8px}
  .hero h1,.page h1,.p-head h1,.lead,.hero p,.p-text p{margin-left:auto;margin-right:auto}
  .hero-sub{flex-direction:column;align-items:center}
  .work-head{flex-direction:column;align-items:center;text-align:center}
  .filters,.tags,nav.main{justify-content:center}
  .tile-meta{align-items:center;text-align:center}
  .facts dd.tags{justify-content:center}
  .p-next{flex-direction:column;align-items:center;text-align:center}
  .p-next a,.p-next a:last-child{max-width:100%;text-align:center;margin:0}
  .cv{margin:0 auto}
  .gallery .caption{text-align:center}
  .service,.steps li,.sec-h{text-align:center}
  .service p,.steps p{margin-left:auto;margin-right:auto}
  .cta-band{flex-direction:column;text-align:center}
  .foot-nav{justify-content:center}
  footer .wrap{flex-direction:column;align-items:center;text-align:center}
}
/* Hamburger menu (phone only) */
.burger{display:none;width:44px;height:44px;border:0;background:none;padding:10px;cursor:pointer;color:var(--header-ink);flex-direction:column;justify-content:center;gap:6px}
.burger span{display:block;height:2px;width:24px;background:currentColor;border-radius:2px;transition:transform .25s, opacity .2s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
@media (max-width:560px){
  .bar{flex-direction:row!important;justify-content:space-between!important;flex-wrap:wrap;padding-block:14px;gap:0!important}
  .burger{display:flex}
  .right{display:none!important;width:100%;flex-direction:column;align-items:center;gap:22px!important;padding:18px 0 22px}
  .bar.open .right{display:flex!important}
  nav.main{flex-direction:column;align-items:center;gap:16px}
  nav.main a{font-size:22px}
  /* Projects centred on phone */
  .row{justify-content:center}
}
</style>
</head>
<body>

<header class="site">
  <div class="wrap bar">
    <a class="logo" href="#" data-go="">Rosalie Gubbels <span>Creative Design</span></a>
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
    <div class="right" id="menu">
      <nav class="main" id="nav" aria-label="Menu"></nav>
      <div class="lang" role="group" aria-label="Taal / Language">
        <button type="button" data-lang="nl">NL</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</header>

<main>
  <section class="view" id="view-work"></section>
  <article class="view" id="view-project" hidden></article>
  <section class="view" id="view-photography" hidden></section>
  <section class="view" id="view-about" hidden></section>
  <section class="view" id="view-cv" hidden></section>
  <section class="view" id="view-services" hidden></section>
  <section class="view" id="view-contact" hidden></section>
</main>

<footer class="site">
  <div class="wrap">
    <span>© <span id="yr"></span> Rosalie Gubbels Creative Design</span>
    <nav class="foot-nav" id="footnav" aria-label="Footer"></nav>
    <span>rosaliegubbels@gmail.com</span>
  </div>
</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true">
  <button class="x" id="lbx" type="button"></button>
  <button class="pv" id="lbp" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg></button>
  <img id="lbi" alt="">
  <button class="nx" id="lbn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="ct" id="lbc"></div>
</div>

/* ---------- Home grid ---------- */
function renderFilters(){
  const used = CATS.filter(c => PROJECTS.some(p => p.cats.includes(c)));
  $("#filters").innerHTML = ["All",...used].map(c =>
    `<button class="chip" type="button" data-cat="${esc(c)}">${esc(c==="All"?T[lang].all:catName(c))}</button>`).join("");
}
function perRow(){ return innerWidth > 960 ? 3 : innerWidth > 560 ? 2 : 1; }
function tileHTML(p, i, style){
  const t = TILES[p.slug];
  const frames = t.frames.map((src,k) =>
    `<img ${k===0?'class="on"':''} ${i>5?'loading="lazy"':''} src="${src}" alt="${k===0?esc(p.title):''}">`).join("");
  return `<a class="tile" href="#${p.slug}" data-go="${p.slug}" style="${style}">
      <div class="frames" style="aspect-ratio:${t.ar}">${frames}</div>
      <div class="tile-meta">
        <h3 class="tile-h">${esc(p.title)}</h3>
        <div class="tags">${p.cats.map(c=>`<span class="tag">${esc(catName(c))}</span>`).join("")}</div>
      </div></a>`;
}
function renderGrid(){
  const n = perRow();
  const list = ORDER.map(s => PROJECTS.find(p => p.slug === s)).filter(p => activeCat==="All" || p.cats.includes(activeCat));
  const avg = n * 0.96;  // typical sum of proportions in a full row
  let html = "", i = 0;
  // full overview on a wide screen uses the hand-made rows; otherwise chunk the list
  const groups = [];
  if(n === 3 && activeCat === "All") ROWS.forEach(r => groups.push(r.map(s => PROJECTS.find(p => p.slug === s))));
  else for(let r = 0; r < list.length; r += n) groups.push(list.slice(r, r + n));
  for(const row of groups){
    const sum = row.reduce((a,p) => a + TILES[p.slug].ar, 0);
    const full = row.length === n || n === 1 || sum >= avg * 0.85;  // a short row of wide images can still fill the width
    html += `<div class="row">` + row.map(p => {
      const ar = TILES[p.slug].ar;
      // full rows share the width by proportion; a short last row keeps a normal height instead of blowing up
      const style = full ? `flex:${ar} 1 0` : `flex:0 0 calc((100% - ${n-1} * var(--gap)) * ${ar / Math.max(avg, sum)})`;
      return tileHTML(p, i++, style);
    }).join("") + `</div>`;
  }
  $("#grid").innerHTML = html;
  $("#grid").dataset.n = n;
  $("#count").textContent = `(${list.length})`;
  $$(".chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat===activeCat));
}
let lastN = perRow();
addEventListener("resize", () => {
  if(perRow() === lastN) return; lastN = perRow();
  if($("#grid")) renderGrid();
  if(!$("#view-project").hidden) show(current, {scroll:false});
});
function applyFilter(){ renderGrid(); }

// Frame cycling: one tile changes at a time, in turn, with a slow crossfade
let turn = 0;
setInterval(() => {
  if(reduced || $("#view-work").hidden || document.hidden) return;
  const tiles = $$(".tile .frames").filter(f => f.querySelectorAll("img").length > 1);
  if(!tiles.length) return;
  const f = tiles[turn++ % tiles.length];
  const imgs = f.querySelectorAll("img");
  let cur = [...imgs].findIndex(im => im.classList.contains("on"));
  imgs[cur].classList.remove("on");
  imgs[(cur + 1) % imgs.length].classList.add("on");
}, 1100);

/* ---------- Project page ---------- */
function renderProject(p){
  const t = T[lang];
  const i = PROJECTS.indexOf(p);
  const prev = PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length], next = PROJECTS[(i+1)%PROJECTS.length];
  // Same justified rows as the homepage: up to three images per row, one shared height, widths by proportion
  const n = perRow(), target = n === 3 ? 2.6 : n === 2 ? 1.7 : 0;
  const fig = (idx, style) => `<figure style="${style}"><img loading="${idx<3?'eager':'lazy'}" src="${im(p.images[idx])}" alt="${esc(p.title)}, ${t.image} ${idx+1}"></figure>`;
  const rowsOf = idxs => {
    const rows = []; let row = [], sum = 0;
    idxs.forEach(i => {
      row.push(i); sum += AR[im(p.images[i])] || 1;
      if(row.length === n || sum >= target){ rows.push(row); row = []; sum = 0; }
    });
    if(row.length) rows.push(row);
    return rows.map(r => {
      const sum = r.reduce((a,i) => a + (AR[im(p.images[i])] || 1), 0);
      const full = n === 1 || r.length === n || sum >= target * 0.75;
      return `<div class="grow">` + r.map(i => {
        const ar = AR[im(p.images[i])] || 1;
        return fig(i, full ? `flex:${ar} 1 0` : `flex:0 0 calc((100% - ${n-1} * var(--gap)) * ${ar / target})`);
      }).join("") + `</div>`;
    }).join("");
  };
  const gallery = p.sections
    ? p.sections.map(s => `<h2 class="caption">${esc(s.h[lang])}</h2>` + rowsOf(s.imgs)).join("")
    : rowsOf(p.images.map((_,k) => k));
  const link = p.link ? `<p><a class="ext" href="${p.link.href}" target="_blank" rel="noopener">${esc(p.link.label[lang])} ↗</a></p>` : "";
  const facts = [
    p.client ? `<div><dt>${t.client}</dt><dd>${esc(p.client[lang])}</dd></div>` : "",
    `<div><dt>${t.disciplines}</dt><dd class="tags">${p.cats.map(c=>`<span class="tag">${esc(catName(c))}</span>`).join("")}</dd></div>`
  ].join("");
  $("#view-project").innerHTML = `
    <div class="band"><div class="wrap p-head">
      <a class="back" href="#" data-go="">${t.back}</a>
      <h1>${esc(p.title)}</h1>
      <div class="p-intro">
        <dl class="facts">${facts}</dl>
        <div class="p-text">${p.text[lang].map(x=>`<p>${esc(x)}</p>`).join("")}${link}</div>
      </div>
    </div></div>
    <div class="wrap"><div class="gallery" id="gallery">${gallery}</div></div>
    <div class="wrap"><nav class="p-next" aria-label="${t.more}">
      <a href="#${prev.slug}" data-go="${prev.slug}"><small>${t.prev}</small><b>${esc(prev.title)}</b></a>
      <a href="#${next.slug}" data-go="${next.slug}"><small>${t.next}</small><b>${esc(next.title)}</b></a>
    </nav></div>`;

}

/* ---------- Navigation ----------
   Links are handled in script, so pages switch even where the address bar
   can't change (previews, sandboxed viewers). The hash is updated when allowed. */
const ALIAS = {"SLO":"slo","work":"","home":"","diensten":"services","fotografie":"photography"};
const PHOTO_KEYS = [];
function resolve(key){
  key = decodeURIComponent(key || "");
  if(key in ALIAS) key = ALIAS[key];
  if(["","services","about","contact","photography","cv"].includes(key)) return key;
  const p = PROJECTS.find(p => p.slug.toLowerCase() === key.toLowerCase());
  return p ? p.slug : "";
}
function show(key, {scroll=true} = {}){
  current = resolve(key);
  const toPhotos = PHOTO_KEYS.includes(current);
  if(toPhotos) current = "about";
  const proj = PROJECTS.find(p => p.slug === current);
  const v = proj ? "project" : (current || "work");
  ["work","project","services","photography","about","cv","contact"].forEach(n => $("#view-"+n).hidden = n !== v);
  if(proj) renderProject(proj);
  const t = T[lang];
  document.title = proj ? `${proj.title} — Rosalie Gubbels` : (v==="work" ? t.docTitle.work : `${t.docTitle[v]} — Rosalie Gubbels`);
  const navKey = v==="project" ? "work" : v;
  const parentKey = navKey;
  $$("#nav a").forEach(a => (a.dataset.nav===navKey || a.dataset.nav===parentKey) ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
  if(toPhotos) { const el = $("#fotografie"); if(el) el.scrollIntoView(); }
  else if(scroll) window.scrollTo(0,0);
}
function go(key){
  show(key);
  try{ history.pushState({key:current}, "", current ? "#"+current : location.pathname + location.search); }catch(e){}
  if(typeof window.gtag === "function") gtag("event", "page_view", {page_title: document.title, page_location: location.href, page_path: location.pathname + location.hash});
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-go]");
  if(a && !e.metaKey && !e.ctrlKey && !e.shiftKey && e.button === 0){ e.preventDefault(); go(a.dataset.go); return; }
  const chip = e.target.closest(".chip");
  if(chip){ activeCat = chip.dataset.cat; applyFilter(); return; }
  const lb = e.target.closest(".lang button");
  if(lb && lb.dataset.lang !== lang){
    lang = lb.dataset.lang; store.set("rg-lang", lang);
    renderChrome(); show(current, {scroll:false});
    return;
  }
  const f = e.target.closest("#gallery figure, #photos figure, #cv");
  if(f){
    const box = f.id==="cv" ? f : (f.closest("#gallery, #photos") || f.parentElement);
    const imgs = [...box.querySelectorAll("img")].map(i => i.src);
    openLB(imgs, f.id==="cv" ? 0 : [...box.querySelectorAll("figure")].indexOf(f));
  }
});
addEventListener("popstate", () => show(location.hash.slice(1)));
addEventListener("hashchange", () => { if(resolve(location.hash.slice(1)) !== current) show(location.hash.slice(1)); });

/* ---------- Lightbox ---------- */
let lbList = [], lbIdx = 0;
function openLB(list, i){ lbList = list; lbIdx = i; showLB(); $("#lb").hidden = false; document.body.style.overflow = "hidden"; $("#lbx").focus(); }
function showLB(){ $("#lbi").src = lbList[lbIdx]; $("#lbc").textContent = `${lbIdx+1} / ${lbList.length}`; $("#lbp").hidden = $("#lbn").hidden = lbList.length < 2; }
function closeLB(){ $("#lb").hidden = true; document.body.style.overflow = ""; }
const step = d => { lbIdx = (lbIdx + d + lbList.length) % lbList.length; showLB(); };
$("#lbx").onclick = closeLB; $("#lbp").onclick = () => step(-1); $("#lbn").onclick = () => step(1);
$("#lb").addEventListener("click", e => { if(e.target.id === "lb") closeLB(); });
addEventListener("keydown", e => {
  if($("#lb").hidden) return;
  if(e.key==="Escape") closeLB(); if(e.key==="ArrowLeft") step(-1); if(e.key==="ArrowRight") step(1);
});


function measure(){
  document.documentElement.style.setProperty("--hdr", $("header.site").offsetHeight + "px");
  document.documentElement.style.setProperty("--ftr", $("footer.site").offsetHeight + "px");
}
addEventListener("resize", measure);
try{ document.fonts.ready.then(measure); }catch(e){}
try{ const ro = new ResizeObserver(measure); ro.observe($("header.site")); ro.observe($("footer.site")); }catch(e){}
renderChrome();
show(location.hash.slice(1), {scroll:false});
measure();
// Hamburger menu
(function(){
  const bar=document.querySelector("header.site .bar"), bt=document.getElementById("burger");
  const set=o=>{bar.classList.toggle("open",o);bt.setAttribute("aria-expanded",o)};
  bt.addEventListener("click",()=>set(!bar.classList.contains("open")));
  document.getElementById("nav").addEventListener("click",e=>{if(e.target.closest("a"))set(false)});
  document.querySelector("header.site .logo").addEventListener("click",()=>set(false));
  addEventListener("resize",()=>{if(innerWidth>560)set(false)});
})();
